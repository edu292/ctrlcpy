name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Android grabber
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang \
            -std=c23 -O3 -s grabber.c -o grabber

      - name: Build Host
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-14
          gcc-14 -std=c23 -O3 ctrlcpy.c -o ctrlcpy

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" ctrlcpy grabber \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
